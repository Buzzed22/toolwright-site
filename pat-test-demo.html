<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pat Test Ltd — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAEEF0;
    --card: #FFFFFF;
    --ink: #1D242B;
    --ink-soft: #566370;
    --navy: #223A5E;
    --lime: #7FA33D;
    --line: #D9E0E5;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:28px; text-transform:uppercase; letter-spacing:0.02em; color:var(--navy); }
  .brand span{ color:var(--lime); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Rajdhani', sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:700; font-size:19px; margin:0 0 20px 0; color:var(--navy); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--navy); font-size:16px; font-weight:700; cursor:pointer; }
  .stepper button:hover{ background:var(--navy); color:white; }
  .stepper .count{ font-family:'Space Mono', monospace; font-size:16px; min-width:24px; text-align:center; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--navy); color:white; border-color:var(--navy); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--lime); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--navy); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.2); }
  .t-line.muted{ opacity:0.7; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#B9DA85; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--lime); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Pat Test <span>Ltd</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your test</h2>
      <div class="field">
        <label>Number of items</label>
        <div class="stepper">
          <button onclick="step(-5)">−</button>
          <div class="count" id="itemsVal">20</div>
          <button onclick="step(5)">+</button>
        </div>
      </div>
      <div class="field">
        <label>Site type</label>
        <div class="pillrow" id="siteRow">
          <div class="pill active" data-rate="1.8">Office</div>
          <div class="pill" data-rate="2.2">Workshop / trade</div>
          <div class="pill" data-rate="2.5">Hospitality / event</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="30" data-label="Same-day service"> Same-day service <span class="price">+£30</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="25" data-label="Out of Carlisle area travel"> Out of area travel <span class="price">+£25</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rItems">20 items · Office</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Request a booking</button>
      <div class="note">Estimate only — Ellis confirms final price</div>
    </div>
  </div>
</div>
<script>
  let items = 20;
  function step(dir){
    items = Math.max(1, Math.min(200, items+dir));
    document.getElementById('itemsVal').textContent = items;
    calc();
  }
  document.querySelectorAll('#siteRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#siteRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const sitePill = document.querySelector('#siteRow .pill.active');
    const rate = parseFloat(sitePill.dataset.rate);
    const siteName = sitePill.textContent;
    const base = Math.max(30, items * rate);
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rItems').textContent = `${items} items · ${siteName}`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Man With A Van — Quick Quote</title><style>body{margin:0;background:#eef1f4;color:#1c2733;font:15px Arial;padding:28px 15px}.w{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}.brand{font-size:28px;font-weight:800}.brand b{color:#c96b2f}.tag{font-size:11px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card,.quote{padding:25px;border-radius:14px;background:#fff;border:1px solid #d7dee5}.quote{background:#1c2733;color:#fff}h2{margin:0 0 18px}.field{margin:0 0 17px}.field b{display:block;margin-bottom:7px}.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{padding:9px 11px;border:1px solid #d7dee5;background:#f4f6f8;border-radius:7px;cursor:pointer}.on{background:#c96b2f;color:#fff;border-color:#c96b2f}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}input{width:100%;padding:10px;border:1px solid #d7dee5;border-radius:7px}.check{display:flex;gap:8px;margin:9px 0}.check span{margin-left:auto;font:12px monospace;color:#678}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #4a5b6c;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:15px}.total strong{font:700 31px monospace;color:#f2b98d}.button{width:100%;padding:13px;margin-top:17px;border:0;border-radius:7px;background:#f2b98d;color:#1c2733;font-weight:bold}.note{font-size:11px;text-align:center;color:#c7d2dc}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Man With <b>A Van</b></div><div class="tag">MOVE QUOTE · CARLISLE</div></header><div class="grid"><section class="card"><h2>Your move</h2><div class="field"><b>Load size</b><div class="opts" id="a"><button type="button" class="opt on" data-p="35">Few items</button><button type="button" class="opt" data-p="70">Single room</button><button type="button" class="opt" data-p="150">Small house</button><button type="button" class="opt" data-p="240">Full house</button></div></div><div class="field"><b>Distance</b><div class="opts" id="b"><button type="button" class="opt on" data-p="0">Local, under 10 miles</button><button type="button" class="opt" data-p="30">10-30 miles</button><button type="button" class="opt" data-p="70">30+ miles</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="25" data-n="Packing materials" type="checkbox">Packing materials <span>+£25</span></label><label class="check"><input class="x" data-p="20" data-n="Furniture dismantling" type="checkbox">Furniture dismantling <span>+£20</span></label></div><div class="inputs"><input id="name" placeholder="Your name"><input id="date" type="date"></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Few items · Local</span><span id="base">£35</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£35</strong></div><button type="button" class="button" onclick="wa()">Send enquiry on WhatsApp</button><p class="note">Demo estimate only — Mike confirms final price on the day.</p></aside></div></main><script>
const WHATSAPP_NUMBER = "447716027771";
let p = 35, q = 0, n = "Few items", s = "Local, under 10 miles";
const labelEl = document.getElementById("label");
const baseEl = document.getElementById("base");
const xsEl = document.getElementById("xs");
const totalEl = document.getElementById("total");
const nameEl = document.getElementById("name");
const dateEl = document.getElementById("date");

function set(id, f) {
  document.querySelectorAll("#" + id + " .opt").forEach(function(e) {
    e.onclick = function() {
      document.querySelectorAll("#" + id + " .opt").forEach(function(x) { x.classList.remove("on"); });
      e.classList.add("on");
      f(e);
      go();
    };
  });
}
set("a", function(e) { p = +e.dataset.p; n = e.textContent; });
set("b", function(e) { q = +e.dataset.p; s = e.textContent; });
document.querySelectorAll(".x").forEach(function(e) { e.onchange = go; });

function go() {
  let t = p + q, h = "";
  document.querySelectorAll(".x:checked").forEach(function(e) {
    t += +e.dataset.p;
    h += '<div class="row"><span>' + e.dataset.n + '</span><span>+£' + e.dataset.p + '</span></div>';
  });
  labelEl.textContent = n + " · " + s;
  baseEl.textContent = "£" + (p + q);
  xsEl.innerHTML = h;
  totalEl.textContent = "£" + t;
}

function wa() {
  const m = "Quote request\nName: " + nameEl.value + "\nMove date: " + dateEl.value + "\nMove: " + labelEl.textContent + "\nEstimated total: " + totalEl.textContent;
  location.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(m);
}
go();
</script></body></html>

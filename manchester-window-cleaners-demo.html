<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manchester Window Cleaners — Instant Estimate</title><style>:root{--i:#173348;--a:#2582ad;--p:#edf7fb;--l:#d3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{background:#f3fafd;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:#fff}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #618aa0;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#9ee5fc;font:700 33px monospace}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#93dbf2;color:#123f50;font-weight:bold}.note{margin:11px 0 0;color:#c5dce7;font-size:11px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Manchester <b>Window Cleaners</b></div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Your property</h1><div class="field"><span class="label">Property type</span><div class="opts" id="property"><button class="opt on" data-p="18">Flat / terrace</button><button class="opt" data-p="24">Semi-detached</button><button class="opt" data-p="30">Detached house</button><button class="opt" data-p="40">Large property</button></div></div><div class="field"><span class="label">Cleaning frequency</span><div class="opts" id="frequency"><button class="opt on" data-p="0">Regular clean</button><button class="opt" data-p="8">One-off clean</button><button class="opt" data-p="15">First deep clean</button></div></div><div class="field"><span class="label">Also include</span><label class="check"><input class="x" data-p="5" data-n="Front door" type="checkbox">Front door <span>+£5</span></label><label class="check"><input class="x" data-p="10" data-n="Conservatory" type="checkbox">Conservatory <span>+£10</span></label><label class="check"><input class="x" data-p="15" data-n="Inside windows" type="checkbox">Inside windows <span>+£15</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Flat / terrace</span><span id="base">£18</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£18</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — Manchester Window Cleaners confirms the final price.</p></aside></div></main><script>let a=18,b=0,n="Flat / terrace";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("property",e=>{a=+e.dataset.p;n=e.textContent});set("frequency",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

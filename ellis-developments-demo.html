<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ellis Developments — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECEDEB;
    --card: #FFFFFF;
    --ink: #22251F;
    --ink-soft: #5A6055;
    --brick: #8C4A38;
    --slate: #40534A;
    --line: #DBDDD6;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:30px; color:var(--slate); }
  .brand span{ color:var(--brick); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:22px; margin:0 0 20px 0; color:var(--slate); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .field label .val{ font-family:'Space Mono', monospace; color:var(--brick); font-weight:700; }
  input[type=range]{ width:100%; accent-color: var(--slate); }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--slate); color:white; border-color:var(--slate); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--brick); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--slate); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#E8B49E; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--brick); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Ellis <span>Developments</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your project</h2>
      <div class="field">
        <label>Project type</label>
        <div class="pillrow" id="jobRow">
          <div class="pill active" data-base="18000" data-name="Single-storey extension">Single-storey extension</div>
          <div class="pill" data-base="32000" data-name="Two-storey extension">Two-storey extension</div>
          <div class="pill" data-base="9000" data-name="Loft conversion">Loft conversion</div>
          <div class="pill" data-base="4500" data-name="Knock-through / internal walls">Knock-through</div>
        </div>
      </div>
      <div class="field">
        <label>Approx. size <span class="val" id="sizeVal">20 m²</span></label>
        <input type="range" id="size" min="5" max="60" step="5" value="20">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="2500" data-label="Bi-fold / large glazing"> Bi-fold / large glazing <span class="price">+£2,500</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="1800" data-label="Underfloor heating"> Underfloor heating <span class="price">+£1,800</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rJob">Single-storey extension · 20 m²</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Request a design visit</button>
      <div class="note">Estimate only — Sam confirms after site visit</div>
    </div>
  </div>
</div>
<script>
  document.getElementById('size').addEventListener('input', calc);
  document.querySelectorAll('#jobRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#jobRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const size = parseInt(document.getElementById('size').value);
    document.getElementById('sizeVal').textContent = size + ' m²';
    const jobPill = document.querySelector('#jobRow .pill.active');
    const base = parseFloat(jobPill.dataset.base);
    const jobName = jobPill.dataset.name;
    const jobBase = base * (size / 20);
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price.toLocaleString()}</span></div>`;
    });
    const total = jobBase + extrasTotal;
    document.getElementById('rJob').textContent = `${jobName} · ${size} m²`;
    document.getElementById('rBase').textContent = `£${Math.round(jobBase).toLocaleString()}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${Math.round(total).toLocaleString()}`;
  }
  calc();
</script>
</body>
</html>

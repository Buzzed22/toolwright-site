<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bespoke Catering — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1EEE7;
    --card: #FFFFFF;
    --ink: #2E281F;
    --ink-soft: #6E6555;
    --plum: #5B3A4E;
    --gold: #BE8A3D;
    --line: #E2DACB;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Playfair Display', serif; font-weight:700; font-size:28px; color:var(--plum); }
  .brand span{ color:var(--gold); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Playfair Display', serif; font-weight:700; font-size:20px; margin:0 0 20px 0; color:var(--plum); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .field label .val{ font-family:'Space Mono', monospace; color:var(--gold); font-weight:700; }
  input[type=range]{ width:100%; accent-color: var(--plum); }
  .pillcol{ display:flex; flex-direction:column; gap:8px; }
  .pill{ padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--plum); color:white; border-color:var(--plum); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--gold); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--plum); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F0CE95; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--gold); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Bespoke <span>Catering</span></div>
    <div class="tag">Instant Quote · Cumbria</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your event</h2>
      <div class="field">
        <label>Guests <span class="val" id="guestsVal">50</span></label>
        <input type="range" id="guests" min="10" max="200" step="5" value="50">
      </div>
      <div class="field">
        <label>Menu style</label>
        <div class="pillcol" id="menuRow">
          <div class="pill active" data-rate="18" data-name="Finger buffet">Finger buffet</div>
          <div class="pill" data-rate="28" data-name="Hog roast / BBQ">Hog roast / BBQ</div>
          <div class="pill" data-rate="45" data-name="Sit-down wedding breakfast">Sit-down wedding breakfast</div>
          <div class="pill" data-rate="12" data-name="Afternoon tea">Afternoon tea</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="6" data-label="Evening food (per guest)"> Evening food <span class="price">+£6/guest</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="150" data-label="Bar service staff"> Bar service staff <span class="price">+£150</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="80" data-label="Dietary &amp; allergen menu"> Dietary &amp; allergen menu <span class="price">+£80</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rMenu">Finger buffet · 50 guests</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Enquire with Iain</button>
      <div class="note">Estimate only — confirmed after menu tasting</div>
    </div>
  </div>
</div>
<script>
  document.getElementById('guests').addEventListener('input', calc);
  document.querySelectorAll('#menuRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#menuRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const guests = parseInt(document.getElementById('guests').value);
    document.getElementById('guestsVal').textContent = guests;
    const menuPill = document.querySelector('#menuRow .pill.active');
    const rate = parseFloat(menuPill.dataset.rate);
    const menuName = menuPill.dataset.name;
    const base = guests * rate;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      if(c.dataset.label.includes('per guest')){
        const cost = guests * parseFloat(c.dataset.price);
        extrasTotal += cost;
        extrasHtml += `<div class="t-line muted"><span>${c.dataset.label} × ${guests}</span><span>+£${cost.toFixed(0)}</span></div>`;
      } else {
        const price = parseFloat(c.dataset.price);
        extrasTotal += price;
        extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
      }
    });
    const total = base + extrasTotal;
    document.getElementById('rMenu').textContent = `${menuName} · ${guests} guests`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

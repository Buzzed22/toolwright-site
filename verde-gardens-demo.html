<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verde Gardens — Instant Estimate</title><style>:root{--i:#23452e;--a:#5b9b59;--p:#f1f7ef;--l:#d5e4d2}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:28px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:white;border:1px solid var(--l)}.quote{background:var(--i);color:white;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f4faf1;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #6e8d70;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#afe69a;font:700 33px monospace}.button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:8px;background:#9bda85;color:#1e481e;font-weight:bold}.note{font-size:11px;text-align:center;color:#cde0c9;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>Verde</b> Gardens</div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Plan your garden visit</h1><div class="field"><span class="label">Garden size</span><div class="opts" id="size"><button class="opt on" data-p="45">Small garden</button><button class="opt" data-p="70">Medium garden</button><button class="opt" data-p="100">Large garden</button><button class="opt" data-p="140">Very large garden</button></div></div><div class="field"><span class="label">Main service</span><div class="opts" id="service"><button class="opt on" data-p="0">Garden tidy</button><button class="opt" data-p="25">Lawn care</button><button class="opt" data-p="35">Hedge trimming</button><button class="opt" data-p="45">Garden clearance</button></div></div><div class="field"><span class="label">Possible extras</span><label class="check"><input class="x" data-p="20" data-n="Green waste removal" type="checkbox">Green waste removal <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Weed control" type="checkbox">Weed control <span>+£25</span></label><label class="check"><input class="x" data-p="30" data-n="Hedge reduction" type="checkbox">Hedge reduction <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Small garden</span><span id="base">£45</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£45</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — Verde Gardens confirms the final quote after checking the work.</p></aside></div></main><script>let a=45,b=0,n="Small garden";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("size",e=>{a=+e.dataset.p;n=e.textContent});set("service",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCM Hire — Instant Estimate</title><style>:root{--i:#312253;--a:#f05b91;--b:#ffd95d;--p:#f8f5ff}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:28px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid #e1daef}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{background:#f5f1fa;border:1px solid #e1daef;border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:#fff}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #73668f;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:var(--b);font:700 33px monospace}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--b);color:var(--i);font-weight:bold}.note{margin:11px 0 0;color:#d4cbe7;font-size:11px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">BCM <b>Hire</b></div><div class="tag">Party hire estimate</div></header><div class="grid"><section class="card"><h1>Plan your party</h1><div class="field"><span class="label">Inflatable</span><div class="opts" id="item"><button class="opt on" data-p="60">Bouncy castle</button><button class="opt" data-p="95">Castle &amp; slide</button><button class="opt" data-p="140">Obstacle course</button><button class="opt" data-p="180">Adult castle</button></div></div><div class="field"><span class="label">Hire duration</span><div class="opts" id="time"><button class="opt on" data-p="0">One day</button><button class="opt" data-p="35">Overnight</button><button class="opt" data-p="65">Weekend</button></div></div><div class="field"><span class="label">Extras</span><label class="check"><input class="x" data-p="25" data-n="Soft play set" type="checkbox">Soft play set <span>+£25</span></label><label class="check"><input class="x" data-p="30" data-n="Party games" type="checkbox">Party games <span>+£30</span></label><label class="check"><input class="x" data-p="45" data-n="Garden games" type="checkbox">Garden games <span>+£45</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Bouncy castle · One day</span><span id="base">£60</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£60</strong></div><button class="button">Check availability</button><p class="note">Demo estimate only — BCM Hire confirms availability and final pricing.</p></aside></div></main><script>let a=60,b=0,n="Bouncy castle",t="One day";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("item",e=>{a=+e.dataset.p;n=e.textContent});set("time",e=>{b=+e.dataset.p;t=e.textContent});document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n+" · "+t;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilkinson Maintenance — Estimate</title><style>body{margin:0;padding:30px 16px;background:#eff6ee;font:15px Arial;color:#24432a}.w{max-width:880px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:bold}.brand b{color:#579854}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card,.quote{padding:25px;border-radius:14px}.card{background:#fff;border:1px solid #d8e7d4}.quote{background:#24432a;color:#fff;height:max-content}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{padding:10px;border:1px solid #d8e7d4;border-radius:8px;background:#f4faf2;cursor:pointer}.on{background:#579854;color:#fff;border-color:#579854}.field{margin:0 0 21px}.field b{display:block;margin-bottom:8px}.check{display:flex;margin:10px 0;gap:8px}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #829b82;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px}.total strong{font:700 32px monospace;color:#abe69c}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#9bd88a;font-weight:bold}.note{text-align:center;font-size:11px;color:#d1dfd0}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Wilkinson <b>Maintenance</b></div><small>INSTANT ESTIMATE</small></header><div class="grid"><section class="card"><h2>Your garden</h2><div class="field"><b>Garden size</b><div class="opts" id="a"><button class="opt on" data-p="45">Small garden</button><button class="opt" data-p="70">Medium garden</button><button class="opt" data-p="100">Large garden</button></div></div><div class="field"><b>Main service</b><div class="opts" id="b"><button class="opt on" data-p="0">Garden tidy</button><button class="opt" data-p="25">Lawn care</button><button class="opt" data-p="35">Hedge cutting</button><button class="opt" data-p="45">Pressure washing</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="20" data-n="Waste removal" type="checkbox">Waste removal <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Weed treatment" type="checkbox">Weed treatment <span>+£25</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Small garden</span><span id="base">£45</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£45</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — final pricing depends on the work required.</p></aside></div></main><script>let p=45,q=0,n="Small garden";function s(id,f){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");f(e);go()})}s("a",e=>{p=+e.dataset.p;n=e.textContent});s("b",e=>q=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let t=p+q,h="";document.querySelectorAll(".x:checked").forEach(e=>{t+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(p+q);xs.innerHTML=h;total.textContent="£"+t}go()</script></body></html>

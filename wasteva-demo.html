<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wasteva — Instant Estimate</title><style>:root{--i:#272f35;--a:#3a986d;--p:#f0f5f2;--l:#d5e1da}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:29px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f4f8f6;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #74877d;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#9ce0bd;font:700 33px monospace}.button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:8px;background:#86d1a9;color:#153a29;font-weight:bold}.note{font-size:11px;text-align:center;color:#cad8d0;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>Waste</b>va</div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Get a quick estimate</h1><div class="field"><span class="label">Amount of waste</span><div class="opts" id="amount"><button class="opt on" data-p="60">A few items</button><button class="opt" data-p="105">Quarter load</button><button class="opt" data-p="175">Half load</button><button class="opt" data-p="295">Full load</button></div></div><div class="field"><span class="label">Collection type</span><div class="opts" id="type"><button class="opt on" data-p="0">General rubbish</button><button class="opt" data-p="25">Garden waste</button><button class="opt" data-p="45">Office clearance</button></div></div><div class="field"><span class="label">Possible extras</span><label class="check"><input class="x" data-p="20" data-n="Heavy lifting" type="checkbox">Heavy lifting <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Appliance disposal" type="checkbox">Appliance disposal <span>+£25</span></label><label class="check"><input class="x" data-p="30" data-n="Difficult access" type="checkbox">Difficult access <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">A few items</span><span id="base">£60</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£60</strong></div><button class="button">Get a price</button><p class="note">Demo estimate only — Wasteva confirms every final collection quote.</p></aside></div></main><script>let a=60,b=0,n="A few items";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("amount",e=>{a=+e.dataset.p;n=e.textContent});set("type",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gutter 2 Ground — Quick Quote</title><style>body{margin:0;background:#eef4ee;color:#1e2b1e;font:15px Arial;padding:28px 15px}.w{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}.brand{font-size:28px;font-weight:800}.brand b{color:#4d7a3f}.tag{font-size:11px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card,.quote{padding:25px;border-radius:14px;background:#fff;border:1px solid #d9e5d4}.quote{background:#1e2b1e;color:#fff}h2{margin:0 0 18px}.field{margin:0 0 17px}.field b{display:block;margin-bottom:7px}.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{padding:9px 11px;border:1px solid #d9e5d4;background:#f3f8f1;border-radius:7px;cursor:pointer}.on{background:#4d7a3f;color:#fff;border-color:#4d7a3f}.check{display:flex;gap:8px;margin:9px 0}.check span{margin-left:auto;font:12px monospace;color:#678}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #4d6b41;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:15px}.total strong{font:700 31px monospace;color:#b6dba0}.button{width:100%;padding:13px;margin-top:17px;border:0;border-radius:7px;background:#8fc97a;color:#1e2b1e;font-weight:bold;text-decoration:none;display:block;text-align:center}.note{font-size:11px;text-align:center;color:#cfe3c6}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Gutter 2 <b>Ground</b></div><div class="tag">GUTTER CLEANING QUOTE</div></header><div class="grid"><section class="card"><h2>Your property</h2><div class="field"><b>Property type</b><div class="opts" id="a"><button type="button" class="opt on" data-p="45">Bungalow</button><button type="button" class="opt" data-p="65">2-storey house</button><button type="button" class="opt" data-p="90">3-storey house</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="20" data-n="Downpipe unblocking" type="checkbox">Downpipe unblocking <span>+£20</span></label><label class="check"><input class="x" data-p="15" data-n="Moss/vegetation removal" type="checkbox">Moss/vegetation removal <span>+£15</span></label><label class="check"><input class="x" data-p="30" data-n="Minor gutter repair" type="checkbox">Minor gutter repair <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Bungalow</span><span id="base">£45</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£45</strong></div><a class="button" href="tel:+441228307550">Call Jake to book — 01228 307550</a><p class="note">Demo estimate only — Gutter 2 Ground confirms the final price on the day.</p></aside></div></main><script>
let p = 45;
const labelEl = document.getElementById("label");
const baseEl = document.getElementById("base");
const xsEl = document.getElementById("xs");
const totalEl = document.getElementById("total");

document.querySelectorAll("#a .opt").forEach(function(e) {
  e.onclick = function() {
    document.querySelectorAll("#a .opt").forEach(function(x) { x.classList.remove("on"); });
    e.classList.add("on");
    p = +e.dataset.p;
    labelEl.textContent = e.textContent;
    go();
  };
});
document.querySelectorAll(".x").forEach(function(e) { e.onchange = go; });

function go() {
  let t = p, h = "";
  document.querySelectorAll(".x:checked").forEach(function(e) {
    t += +e.dataset.p;
    h += '<div class="row"><span>' + e.dataset.n + '</span><span>+£' + e.dataset.p + '</span></div>';
  });
  baseEl.textContent = "£" + p;
  xsEl.innerHTML = h;
  totalEl.textContent = "£" + t;
}
go();
</script></body></html>

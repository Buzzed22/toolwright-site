<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VMove Removals — Instant Estimate</title><style>:root{--i:#202d48;--a:#407dc5;--p:#eff4fb;--l:#d5e0ef}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{background:#f4f8fd;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:#fff}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #6d82a3;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#9bc8ff;font:700 33px monospace}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#8cc0ff;color:#173c6a;font-weight:bold}.note{margin:11px 0 0;color:#c8d9ee;font-size:11px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>VMove</b> Removals</div><div class="tag">Instant removal estimate</div></header><div class="grid"><section class="card"><h1>Plan your move</h1><div class="field"><span class="label">Move size</span><div class="opts" id="size"><button class="opt on" data-p="55">Single item</button><button class="opt" data-p="95">Studio / student</button><button class="opt" data-p="180">One-bedroom flat</button><button class="opt" data-p="320">Two-bedroom home</button></div></div><div class="field"><span class="label">Distance</span><div class="opts" id="distance"><button class="opt on" data-p="0">Local</button><button class="opt" data-p="35">Up to 20 miles</button><button class="opt" data-p="75">20+ miles</button></div></div><div class="field"><span class="label">Extras</span><label class="check"><input class="x" data-p="25" data-n="Packing materials" type="checkbox">Packing materials <span>+£25</span></label><label class="check"><input class="x" data-p="35" data-n="Two-person team" type="checkbox">Two-person team <span>+£35</span></label><label class="check"><input class="x" data-p="30" data-n="Furniture assembly" type="checkbox">Furniture assembly <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Single item</span><span id="base">£55</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£55</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — VMove confirms every removal quote before booking.</p></aside></div></main><script>let a=55,b=0,n="Single item";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("size",e=>{a=+e.dataset.p;n=e.textContent});set("distance",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJ Dixon Exterior Cleaning | Instant Estimate</title><style>:root{--i:#26333b;--a:#e58a35;--p:#f2f0eb;--l:#ded8cc}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Arial;padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:23px;gap:10px}.brand{font-size:26px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:white;height:max-content}h1,h2{font-size:21px;margin:0 0 20px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f7f5f0;border:1px solid var(--l);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--i)}.opt.on{background:var(--i);border-color:var(--i);color:#ffbd74}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #77838a;padding:10px 0;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{font:700 33px monospace;color:#ffbd74}.book{width:100%;border:0;border-radius:8px;background:#f0a252;padding:13px;color:#252d32;font-weight:bold;margin-top:18px}.note{font-size:11px;text-align:center;color:#d0d7da;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">TJ Dixon <b>Exterior Cleaning</b></div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Choose your clean</h1><div class="field"><span class="label">Service</span><div class="opts" id="service"><button class="opt on" data-p="75">Driveway clean</button><button class="opt" data-p="65">Patio clean</button><button class="opt" data-p="55">Gutter clear</button><button class="opt" data-p="120">Roof treatment</button></div></div><div class="field"><span class="label">Area size</span><div class="opts" id="size"><button class="opt on" data-p="0">Small</button><button class="opt" data-p="35">Medium</button><button class="opt" data-p="75">Large</button></div></div><div class="field"><span class="label">Add-ons</span><label class="check"><input class="x" data-p="20" data-n="Weed treatment" type="checkbox">Weed treatment <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Sanding" type="checkbox">Re-sanding <span>+£25</span></label><label class="check"><input class="x" data-p="30" data-n="Sealant" type="checkbox">Protective sealant <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Driveway clean</span><span id="base">£75</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£75</strong></div><button class="book">Get my quote</button><p class="note">Demo estimate only — final pricing is confirmed after TJ Dixon checks the job.</p></aside></div></main><script>let a=75,b=0,n='Driveway clean';function set(id,fn){document.querySelectorAll('#'+id+' .opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.remove('on'));e.classList.add('on');fn(e);go()})}set('service',e=>{a=+e.dataset.p;n=e.textContent});set('size',e=>b=+e.dataset.p);document.querySelectorAll('.x').forEach(e=>e.onchange=go);function go(){let t=a+b,h='';document.querySelectorAll('.x:checked').forEach(e=>{t+=+e.dataset.p;h+='<div class=row><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+'</span></div>'});label.textContent=n;base.textContent='£'+(a+b);xs.innerHTML=h;total.textContent='£'+t}go()</script></body></html>

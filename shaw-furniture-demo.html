<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shaw Furniture Care &amp; Restoration — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFEAE2;
    --card: #FFFFFF;
    --ink: #2E271F;
    --ink-soft: #6E6455;
    --walnut: #5C4630;
    --sage: #6E7C5C;
    --line: #E1D9CA;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Fraunces', serif; font-weight:700; font-size:24px; color:var(--walnut); }
  .brand span{ color:var(--sage); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Fraunces', serif; font-weight:700; font-size:20px; margin:0 0 20px 0; color:var(--walnut); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .pillcol{ display:flex; flex-direction:column; gap:8px; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--walnut); color:white; border-color:var(--walnut); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--sage); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--walnut); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#C9D6BC; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--sage); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Shaw <span>Furniture</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your item</h2>
      <div class="field">
        <label>Item type</label>
        <div class="pillcol" id="itemRow">
          <div class="pill active" data-base="90" data-name="Dining chair (each)">Dining chair (each)</div>
          <div class="pill" data-base="380" data-name="Sofa / armchair suite">Sofa / armchair suite</div>
          <div class="pill" data-base="220" data-name="Sideboard / wardrobe">Sideboard / wardrobe</div>
          <div class="pill" data-base="150" data-name="Table (French polish)">Table (French polish)</div>
        </div>
      </div>
      <div class="field">
        <label>Scope</label>
        <div class="pillrow" id="scopeRow">
          <div class="pill active" data-mult="1">Minor repair</div>
          <div class="pill" data-mult="1.6">Full restoration</div>
          <div class="pill" data-mult="1.3">Reupholster only</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="60" data-label="Fabric upgrade"> Fabric upgrade <span class="price">+£60</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="45" data-label="Foam replacement"> Foam replacement <span class="price">+£45</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rItem">Dining chair · Minor repair</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Enquire with Gill</button>
      <div class="note">Estimate only — confirmed when Gill sees the piece</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#itemRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#itemRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('#scopeRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#scopeRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const itemPill = document.querySelector('#itemRow .pill.active');
    const base = parseFloat(itemPill.dataset.base);
    const itemName = itemPill.dataset.name;
    const scopePill = document.querySelector('#scopeRow .pill.active');
    const mult = parseFloat(scopePill.dataset.mult);
    const scopeName = scopePill.textContent;
    const jobBase = base * mult;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = jobBase + extrasTotal;
    document.getElementById('rItem').textContent = `${itemName} · ${scopeName}`;
    document.getElementById('rBase').textContent = `£${jobBase.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

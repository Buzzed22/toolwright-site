<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lakeland Oven Clean | Instant Estimate</title><style>:root{--i:#2b2927;--a:#bf4e25;--p:#f6f1eb;--l:#e4d8cd}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Arial;padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:23px;gap:10px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:white;height:max-content}h1,h2{font-size:21px;margin:0 0 20px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#faf7f3;border:1px solid var(--l);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--i)}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #867a73;padding:10px 0;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{font:700 33px monospace;color:#ffae7d}.book{width:100%;border:0;border-radius:8px;background:#ec7a4d;padding:13px;color:#3e1d11;font-weight:bold;margin-top:18px}.note{font-size:11px;text-align:center;color:#daccc5;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Lakeland <b>Oven Clean</b></div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Your appliance</h1><div class="field"><span class="label">Oven type</span><div class="opts" id="oven"><button class="opt on" data-p="64">Single oven</button><button class="opt" data-p="85">Double oven</button><button class="opt" data-p="105">Range cooker</button><button class="opt" data-p="120">AGA / Rayburn</button></div></div><div class="field"><span class="label">Condition</span><div class="opts" id="condition"><button class="opt on" data-p="0">Standard clean</button><button class="opt" data-p="25">Heavy build-up</button><button class="opt" data-p="40">Very heavy build-up</button></div></div><div class="field"><span class="label">Add-ons</span><label class="check"><input class="x" data-p="15" data-n="Hob clean" type="checkbox">Hob clean <span>+£15</span></label><label class="check"><input class="x" data-p="15" data-n="Extractor clean" type="checkbox">Extractor clean <span>+£15</span></label><label class="check"><input class="x" data-p="12" data-n="Microwave clean" type="checkbox">Microwave clean <span>+£12</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Single oven</span><span id="base">£64</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£64</strong></div><button class="book">Request a clean</button><p class="note">Demo estimate only — Lakeland Oven Clean confirms all final quotes.</p></aside></div></main><script>let a=64,b=0,n='Single oven';function set(id,fn){document.querySelectorAll('#'+id+' .opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.remove('on'));e.classList.add('on');fn(e);go()})}set('oven',e=>{a=+e.dataset.p;n=e.textContent});set('condition',e=>b=+e.dataset.p);document.querySelectorAll('.x').forEach(e=>e.onchange=go);function go(){let t=a+b,h='';document.querySelectorAll('.x:checked').forEach(e=>{t+=+e.dataset.p;h+='<div class=row><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+'</span></div>'});label.textContent=n;base.textContent='£'+(a+b);xs.innerHTML=h;total.textContent='£'+t}go()</script></body></html>

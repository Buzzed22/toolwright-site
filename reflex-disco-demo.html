<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflex Disco Entertainments — Quick Quote</title><style>body{margin:0;background:#1a0f24;color:#f0e8fa;font:15px Arial;padding:28px 15px}.w{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}.brand{font-size:28px;font-weight:800;color:#fff}.brand b{color:#e85fc2}.tag{font-size:11px;letter-spacing:.12em;color:#c9b8dc}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card{padding:25px;border-radius:14px;background:#251633;border:1px solid #3d2650}.quote{padding:25px;border-radius:14px;background:linear-gradient(135deg,#e85fc2,#7b3fb8);color:#fff}h2{margin:0 0 18px}.field{margin:0 0 17px}.field b{display:block;margin-bottom:7px}.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{padding:9px 11px;border:1px solid #3d2650;background:#1a0f24;color:#f0e8fa;border-radius:7px;cursor:pointer}.on{background:#e85fc2;color:#1a0f24;border-color:#e85fc2}.check{display:flex;gap:8px;margin:9px 0}.check span{margin-left:auto;font:12px monospace;color:#c9b8dc}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}input{width:100%;padding:10px;border:1px solid #3d2650;border-radius:7px;background:#1a0f24;color:#fff}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.3);font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:15px}.total strong{font:700 31px monospace;color:#fff}.button{width:100%;padding:13px;margin-top:17px;border:0;border-radius:7px;background:#1a0f24;color:#fff;font-weight:bold}.note{font-size:11px;text-align:center;color:#f0d9f0}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Reflex <b>Disco</b></div><div class="tag">EVENT DJ QUOTE</div></header><div class="grid"><section class="card"><h2>Your event</h2><div class="field"><b>Event type</b><div class="opts" id="a"><button type="button" class="opt on" data-p="280">Wedding</button><button type="button" class="opt" data-p="180">Birthday party</button><button type="button" class="opt" data-p="220">Corporate event</button></div></div><div class="field"><b>Hours of DJ time</b><div class="opts" id="b"><button type="button" class="opt on" data-p="0">3 hours</button><button type="button" class="opt" data-p="40">4 hours</button><button type="button" class="opt" data-p="80">5 hours</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="60" data-n="Dance floor uplighting" type="checkbox">Dance floor uplighting <span>+£60</span></label><label class="check"><input class="x" data-p="50" data-n="Ceremony sound system" type="checkbox">Ceremony sound system <span>+£50</span></label></div><div class="inputs"><input id="name" placeholder="Your name"><input id="date" type="date"></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Wedding · 3 hours</span><span id="base">£280</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£280</strong></div><button type="button" class="button" onclick="wa()">Send enquiry on WhatsApp</button><p class="note">Demo estimate only — Stuart confirms final price &amp; availability.</p></aside></div></main><script>
const WHATSAPP_NUMBER = "447886857948";
let p = 280, q = 0, n = "Wedding", s = "3 hours";
const labelEl = document.getElementById("label");
const baseEl = document.getElementById("base");
const xsEl = document.getElementById("xs");
const totalEl = document.getElementById("total");
const nameEl = document.getElementById("name");
const dateEl = document.getElementById("date");

function set(id, f) {
  document.querySelectorAll("#" + id + " .opt").forEach(function(e) {
    e.onclick = function() {
      document.querySelectorAll("#" + id + " .opt").forEach(function(x) { x.classList.remove("on"); });
      e.classList.add("on");
      f(e);
      go();
    };
  });
}
set("a", function(e) { p = +e.dataset.p; n = e.textContent; });
set("b", function(e) { q = +e.dataset.p; s = e.textContent; });
document.querySelectorAll(".x").forEach(function(e) { e.onchange = go; });

function go() {
  let t = p + q, h = "";
  document.querySelectorAll(".x:checked").forEach(function(e) {
    t += +e.dataset.p;
    h += '<div class="row"><span>' + e.dataset.n + '</span><span>+£' + e.dataset.p + '</span></div>';
  });
  labelEl.textContent = n + " · " + s;
  baseEl.textContent = "£" + (p + q);
  xsEl.innerHTML = h;
  totalEl.textContent = "£" + t;
}

function wa() {
  const m = "Quote request\nName: " + nameEl.value + "\nEvent date: " + dateEl.value + "\nEvent: " + labelEl.textContent + "\nEstimated total: " + totalEl.textContent;
  location.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(m);
}
go();
</script></body></html>

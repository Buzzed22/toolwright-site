<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VLAD Massage Therapy — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECEEF0;
    --card: #FFFFFF;
    --ink: #1F262B;
    --ink-soft: #5B6670;
    --deep: #2B4A52;
    --coral: #D97757;
    --line: #DBDFE2;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:26px; color:var(--deep); }
  .brand span{ color:var(--coral); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:19px; margin:0 0 20px 0; color:var(--deep); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--deep); color:white; border-color:var(--deep); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--coral); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--deep); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F1B49C; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--coral); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">VLAD <span>Massage</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your session</h2>
      <div class="field">
        <label>Massage type</label>
        <div class="pillrow" id="typeRow">
          <div class="pill active" data-rate="0.8">Relaxation / Swedish</div>
          <div class="pill" data-rate="1.0">Deep tissue</div>
          <div class="pill" data-rate="1.1">Sports massage</div>
        </div>
      </div>
      <div class="field">
        <label>Duration</label>
        <div class="pillrow" id="durRow">
          <div class="pill" data-min="30">30 min</div>
          <div class="pill active" data-min="45">45 min</div>
          <div class="pill" data-min="60">60 min</div>
          <div class="pill" data-min="90">90 min</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="10" data-label="Cupping"> Cupping <span class="price">+£10</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="15" data-label="Acupuncture"> Acupuncture <span class="price">+£15</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rType">Relaxation · 45 min</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Book with Vlad</button>
      <div class="note">Estimate only — confirmed when you book</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#typeRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#typeRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('#durRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#durRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const typePill = document.querySelector('#typeRow .pill.active');
    const rate = parseFloat(typePill.dataset.rate);
    const typeName = typePill.textContent;
    const durPill = document.querySelector('#durRow .pill.active');
    const mins = parseFloat(durPill.dataset.min);
    const durName = durPill.textContent;
    const perMin = 1.05;
    const base = mins * perMin * rate;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rType').textContent = `${typeName} · ${durName}`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

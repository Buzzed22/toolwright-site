<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chip 'n' Chill Pet Sitting — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF3EC;
    --card: #FFFFFF;
    --ink: #253327;
    --ink-soft: #5F6E5F;
    --leaf: #4F7A4F;
    --sun: #E3A93B;
    --line: #DCE6D9;
    --radius: 16px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Quicksand', sans-serif; font-weight:700; font-size:27px; color:var(--leaf); }
  .brand span{ color:var(--sun); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Quicksand', sans-serif; font-weight:700; font-size:19px; margin:0 0 20px 0; color:var(--leaf); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--leaf); color:white; border-color:var(--leaf); }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--leaf); font-size:16px; font-weight:700; cursor:pointer; }
  .stepper button:hover{ background:var(--leaf); color:white; }
  .stepper .count{ font-family:'Space Mono', monospace; font-size:16px; min-width:18px; text-align:center; }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--sun); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--leaf); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F5D493; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:10px; background:var(--sun); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Chip 'n' <span>Chill</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your pet care</h2>
      <div class="field">
        <label>Service</label>
        <div class="pillrow" id="serviceRow">
          <div class="pill active" data-rate="12">Drop-in visit</div>
          <div class="pill" data-rate="35">Overnight sit</div>
          <div class="pill" data-rate="14">Dog walk (30 min)</div>
        </div>
      </div>
      <div class="field">
        <label>Number of visits / nights</label>
        <div class="stepper">
          <button onclick="step(-1)">−</button>
          <div class="count" id="countVal">3</div>
          <button onclick="step(1)">+</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="3" data-label="Medication administration"> Medication administration <span class="price">+£3/visit</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="5" data-label="Extra playtime"> Extra playtime <span class="price">+£5/visit</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rService">3 × Drop-in visit</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Book with Mae</button>
      <div class="note">Estimate only — Mae confirms after a free meet &amp; greet</div>
    </div>
  </div>
</div>
<script>
  let count = 3;
  function step(dir){
    count = Math.max(1, Math.min(30, count+dir));
    document.getElementById('countVal').textContent = count;
    calc();
  }
  document.querySelectorAll('#serviceRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#serviceRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const servicePill = document.querySelector('#serviceRow .pill.active');
    const rate = parseFloat(servicePill.dataset.rate);
    const serviceName = servicePill.textContent;
    const base = rate * count;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price) * count;
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label} × ${count}</span><span>+£${price.toFixed(0)}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rService').textContent = `${count} × ${serviceName}`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

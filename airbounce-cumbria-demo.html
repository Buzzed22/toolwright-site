<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airbounce Cumbria | Party Hire Estimate</title><style>:root{--i:#20204d;--a:#ef5b83;--b:#ffe56a;--p:#f6f5ff}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:23px;gap:10px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid #deddf0}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{font-size:21px;margin:0 0 20px}.field{margin:0 0 22px}.label{font-weight:bold;display:block;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f5f4fb;border:1px solid #deddf0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--i)}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #61618a;padding:10px 0;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{font:700 33px monospace;color:var(--b)}button.book{width:100%;border:0;border-radius:8px;background:var(--b);padding:13px;color:var(--i);font-weight:bold;margin-top:18px}.note{font-size:11px;text-align:center;color:#c6c6df;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Air<b>bounce</b> Cumbria</div><div class="tag">Party hire estimate</div></header><div class="grid"><section class="card"><h1>Plan the fun</h1><div class="field"><span class="label">Inflatable</span><div class="opts" id="item"><button class="opt on" data-p="85">Bouncy castle</button><button class="opt" data-p="120">Castle & slide</button><button class="opt" data-p="160">Obstacle course</button><button class="opt" data-p="210">Rodeo bull</button></div></div><div class="field"><span class="label">Hire duration</span><div class="opts" id="time"><button class="opt on" data-p="0">One day</button><button class="opt" data-p="35">Overnight</button><button class="opt" data-p="70">Weekend</button></div></div><div class="field"><span class="label">Optional extras</span><label class="check"><input class="x" data-p="25" data-n="Party games" type="checkbox">Party games <span>+£25</span></label><label class="check"><input class="x" data-p="40" data-n="Soft play set" type="checkbox">Soft play set <span>+£40</span></label><label class="check"><input class="x" data-p="60" data-n="Staff supervision" type="checkbox">Staff supervision <span>+£60</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Bouncy castle · One day</span><span id="base">£85</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£85</strong></div><button class="book">Check availability</button><p class="note">Demo estimate only — availability and final price are confirmed by Airbounce Cumbria.</p></aside></div></main><script>let a=85,b=0,an='Bouncy castle',bn='One day';function set(id,fn){document.querySelectorAll('#'+id+' .opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.remove('on'));e.classList.add('on');fn(e);go()})}set('item',e=>{a=+e.dataset.p;an=e.textContent});set('time',e=>{b=+e.dataset.p;bn=e.textContent});document.querySelectorAll('.x').forEach(e=>e.onchange=go);function go(){let n=a+b,h='';document.querySelectorAll('.x:checked').forEach(e=>{n+=+e.dataset.p;h+='<div class=row><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+'</span></div>'});label.textContent=an+' · '+bn;base.textContent='£'+(a+b);xs.innerHTML=h;total.textContent='£'+n}go()</script></body></html>

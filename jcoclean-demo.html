<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JCOCLEAN — Instant Estimate</title><style>:root{--i:#202d3b;--a:#2d87a1;--p:#edf5f7;--l:#d3e3e7}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:29px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:white;border:1px solid var(--l)}.quote{background:var(--i);color:white;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f3f9fa;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #67848e;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#9ce1ef;font:700 33px monospace}.button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:8px;background:#8bd5e5;color:#173d4a;font-weight:bold}.note{font-size:11px;text-align:center;color:#c7dce1;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>JCO</b>CLEAN</div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Build your clean</h1><div class="field"><span class="label">Service</span><div class="opts" id="service"><button class="opt on" data-p="50">Regular home clean</button><button class="opt" data-p="90">Deep clean</button><button class="opt" data-p="115">End of tenancy</button><button class="opt" data-p="95">Office clean</button></div></div><div class="field"><span class="label">Property size</span><div class="opts" id="size"><button class="opt on" data-p="0">Up to 2 bedrooms</button><button class="opt" data-p="25">3 bedrooms</button><button class="opt" data-p="45">4+ bedrooms</button></div></div><div class="field"><span class="label">Optional extras</span><label class="check"><input class="x" data-p="15" data-n="Inside fridge" type="checkbox">Inside fridge <span>+£15</span></label><label class="check"><input class="x" data-p="20" data-n="Inside oven" type="checkbox">Inside oven <span>+£20</span></label><label class="check"><input class="x" data-p="20" data-n="Window clean" type="checkbox">Window clean <span>+£20</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Regular home clean</span><span id="base">£50</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£50</strong></div><button class="button">Get a free quote</button><p class="note">Demo estimate only — JCOCLEAN confirms all final quotes before booking.</p></aside></div></main><script>let a=50,b=0,n="Regular home clean";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("service",e=>{a=+e.dataset.p;n=e.textContent});set("size",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DS Roofing Cumbria — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECEDEE;
    --card: #FFFFFF;
    --ink: #22262B;
    --ink-soft: #5B6470;
    --slate: #33475B;
    --rust: #C15A34;
    --line: #DADCE1;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Oswald', sans-serif; font-weight:700; font-size:26px; text-transform:uppercase; letter-spacing:0.01em; color:var(--slate); }
  .brand span{ color:var(--rust); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:600; font-size:18px; margin:0 0 20px 0; color:var(--slate); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .pillgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); text-align:center; }
  .pill.active{ background:var(--slate); color:white; border-color:var(--slate); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--rust); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--slate); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.2); }
  .t-line.muted{ opacity:0.7; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F0AE8C; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--rust); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">DS <span>Roofing</span> Cumbria</div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your roof job</h2>
      <div class="field">
        <label>Job type</label>
        <div class="pillgrid" id="jobRow">
          <div class="pill active" data-base="180">Leak repair</div>
          <div class="pill" data-base="350">Re-felt flat roof</div>
          <div class="pill" data-base="2800">Full re-roof</div>
          <div class="pill" data-base="220">Guttering replacement</div>
        </div>
      </div>
      <div class="field">
        <label>Roof size (for re-roof jobs)</label>
        <div class="pillrow" id="sizeRow">
          <div class="pill active" data-mult="1">Small / outbuilding</div>
          <div class="pill" data-mult="1.6">Semi-detached</div>
          <div class="pill" data-mult="2.2">Detached / large</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="450" data-label="Velux window fitting"> Velux window fitting <span class="price">+£450</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="300" data-label="Chimney repointing"> Chimney repointing <span class="price">+£300</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="250" data-label="Loft insulation top-up"> Loft insulation top-up <span class="price">+£250</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rJob">Leak repair</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Request this job</button>
      <div class="note">Estimate only — Daniel confirms final price after inspection</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#jobRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#jobRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('#sizeRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#sizeRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const jobPill = document.querySelector('#jobRow .pill.active');
    const base = parseFloat(jobPill.dataset.base);
    const jobName = jobPill.textContent;
    const sizePill = document.querySelector('#sizeRow .pill.active');
    const mult = jobName === 'Full re-roof' ? parseFloat(sizePill.dataset.mult) : 1;
    const jobBase = base * mult;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = jobBase + extrasTotal;
    document.getElementById('rJob').textContent = jobName;
    document.getElementById('rBase').textContent = `£${jobBase.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

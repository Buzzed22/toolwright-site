<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>McFadden Rubbish Removal — Estimate</title><style>body{margin:0;padding:30px 16px;background:#eef4ed;font:15px Arial;color:#21382a}.w{max-width:880px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:bold}.brand b{color:#4e9b5d}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card,.quote{padding:25px;border-radius:14px}.card{background:#fff;border:1px solid #d8e3d5}.quote{background:#21382a;color:#fff;height:max-content}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{padding:10px;border:1px solid #d8e3d5;border-radius:8px;background:#f4f9f2;cursor:pointer}.on{background:#4e9b5d;color:#fff;border-color:#4e9b5d}.field{margin:0 0 21px}.field b{display:block;margin-bottom:8px}.check{display:flex;margin:10px 0;gap:8px}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #829984;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px}.total strong{font:700 32px monospace;color:#a9e49a}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#9bd987;font-weight:bold}.note{text-align:center;font-size:11px;color:#d1dfd0}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">McFadden <b>Rubbish Removal</b></div><small>INSTANT ESTIMATE</small></header><div class="grid"><section class="card"><h2>What needs clearing?</h2><div class="field"><b>Amount of waste</b><div class="opts" id="a"><button class="opt on" data-p="60">A few items</button><button class="opt" data-p="105">Quarter load</button><button class="opt" data-p="175">Half load</button><button class="opt" data-p="290">Full load</button></div></div><div class="field"><b>Collection type</b><div class="opts" id="b"><button class="opt on" data-p="0">Household</button><button class="opt" data-p="25">Garden waste</button><button class="opt" data-p="45">House clearance</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="20" data-n="Heavy items" type="checkbox">Heavy items <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Appliance disposal" type="checkbox">Appliance disposal <span>+£25</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">A few items</span><span id="base">£60</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£60</strong></div><button class="button">Request collection</button><p class="note">Demo estimate only — final pricing is confirmed before collection.</p></aside></div></main><script>let p=60,q=0,n="A few items";function s(id,f){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");f(e);go()})}s("a",e=>{p=+e.dataset.p;n=e.textContent});s("b",e=>q=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let t=p+q,h="";document.querySelectorAll(".x:checked").forEach(e=>{t+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(p+q);xs.innerHTML=h;total.textContent="£"+t}go()</script></body></html>

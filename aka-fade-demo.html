<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aka Fade Barber — Price Estimator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9E9EA;
    --card: #FFFFFF;
    --ink: #1A1B1D;
    --ink-soft: #58595D;
    --black: #17181A;
    --red: #C0392B;
    --line: #D6D6D8;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Bebas Neue', sans-serif; font-size:34px; letter-spacing:0.03em; color:var(--black); }
  .brand span{ color:var(--red); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Bebas Neue', sans-serif; font-size:24px; letter-spacing:0.02em; margin:0 0 20px 0; color:var(--black); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .pillcol{ display:flex; flex-direction:column; gap:8px; }
  .pill{ padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--black); color:white; border-color:var(--black); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--red); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--black); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.2); }
  .t-line.muted{ opacity:0.7; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#E88A7D; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--red); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">AKA <span>FADE</span> BARBER</div>
    <div class="tag">Price Estimator · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your cut</h2>
      <div class="field">
        <label>Service</label>
        <div class="pillcol" id="serviceRow">
          <div class="pill active" data-base="18" data-name="Skin fade">Skin fade</div>
          <div class="pill" data-base="15" data-name="Regular cut">Regular cut</div>
          <div class="pill" data-base="25" data-name="Cut &amp; beard">Cut &amp; beard</div>
          <div class="pill" data-base="12" data-name="Kids cut">Kids cut</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="8" data-label="Hot towel shave"> Hot towel shave <span class="price">+£8</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="5" data-label="Eyebrow trim"> Eyebrow trim <span class="price">+£5</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="10" data-label="Hair design / tattoo"> Hair design / tattoo <span class="price">+£10</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rService">Skin fade</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Book your slot</button>
      <div class="note">Estimate only — final price confirmed in shop</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#serviceRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#serviceRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const servicePill = document.querySelector('#serviceRow .pill.active');
    const base = parseFloat(servicePill.dataset.base);
    const serviceName = servicePill.dataset.name;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rService').textContent = serviceName;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

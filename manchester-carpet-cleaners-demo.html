<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manchester Carpet Cleaners — Instant Estimate</title><style>:root{--i:#25343b;--a:#28859c;--p:#eef5f6;--l:#d5e2e5}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px Arial;color:var(--i);padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:23px}.brand{font-size:27px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:#fff;height:max-content}h1,h2{margin:0 0 20px;font-size:21px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{background:#f3f8f9;border:1px solid var(--l);border-radius:8px;padding:10px 12px;color:var(--i);cursor:pointer}.opt.on{background:var(--a);border-color:var(--a);color:#fff}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;color:#687;font:12px monospace}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #67818b;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{color:#91e0ee;font:700 33px monospace}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#8bd8e6;color:#153943;font-weight:bold}.note{margin:11px 0 0;color:#c9dce1;font-size:11px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Manchester <b>Carpet Cleaners</b></div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>What would you like cleaned?</h1><div class="field"><span class="label">Number of rooms</span><div class="opts" id="rooms"><button class="opt on" data-p="45">One room</button><button class="opt" data-p="70">Two rooms</button><button class="opt" data-p="95">Three rooms</button><button class="opt" data-p="120">Four rooms</button></div></div><div class="field"><span class="label">Cleaning level</span><div class="opts" id="level"><button class="opt on" data-p="0">Standard clean</button><button class="opt" data-p="25">Deep clean</button><button class="opt" data-p="40">Stain treatment</button></div></div><div class="field"><span class="label">Extras</span><label class="check"><input class="x" data-p="25" data-n="Sofa clean" type="checkbox">Sofa clean <span>+£25</span></label><label class="check"><input class="x" data-p="15" data-n="Stairs and landing" type="checkbox">Stairs and landing <span>+£15</span></label><label class="check"><input class="x" data-p="20" data-n="Odour treatment" type="checkbox">Odour treatment <span>+£20</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">One room</span><span id="base">£45</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£45</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — Manchester Carpet Cleaners confirms the final price.</p></aside></div></main><script>let a=45,b=0,n="One room";function set(id,fn){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");fn(e);go()})}set("rooms",e=>{a=+e.dataset.p;n=e.textContent});set("level",e=>b=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let v=a+b,h="";document.querySelectorAll(".x:checked").forEach(e=>{v+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(a+b);xs.innerHTML=h;total.textContent="£"+v}go()</script></body></html>

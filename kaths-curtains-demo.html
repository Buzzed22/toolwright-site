<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kath's Curtains — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1EEE8;
    --card: #FFFFFF;
    --ink: #332C24;
    --ink-soft: #746A5B;
    --teal: #3C6D6A;
    --coral: #C87A54;
    --line: #E3DCCE;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; color:var(--teal); }
  .brand span{ color:var(--coral); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; margin:0 0 20px 0; color:var(--teal); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--teal); font-size:16px; font-weight:700; cursor:pointer; }
  .stepper button:hover{ background:var(--teal); color:white; }
  .stepper .count{ font-family:'Space Mono', monospace; font-size:16px; min-width:18px; text-align:center; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--teal); color:white; border-color:var(--teal); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--coral); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--teal); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F0C4A8; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--coral); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Kath's <span>Curtains</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your windows</h2>
      <div class="field">
        <label>Number of windows</label>
        <div class="stepper">
          <button onclick="step(-1)">−</button>
          <div class="count" id="windowsVal">2</div>
          <button onclick="step(1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>Style</label>
        <div class="pillrow" id="styleRow">
          <div class="pill active" data-rate="90">Curtains, standard fabric</div>
          <div class="pill" data-rate="150">Curtains, premium fabric</div>
          <div class="pill" data-rate="110">Roman blind</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="15" data-label="Blackout lining"> Blackout lining <span class="price">+£15/window</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="20" data-label="Tie-backs"> Tie-backs <span class="price">+£20/window</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rStyle">2 × Curtains, standard fabric</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Book a measure &amp; quote</button>
      <div class="note">Estimate only — Fiona &amp; Kath confirm at your free measure</div>
    </div>
  </div>
</div>
<script>
  let windows = 2;
  function step(dir){
    windows = Math.max(1, Math.min(20, windows+dir));
    document.getElementById('windowsVal').textContent = windows;
    calc();
  }
  document.querySelectorAll('#styleRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#styleRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const stylePill = document.querySelector('#styleRow .pill.active');
    const rate = parseFloat(stylePill.dataset.rate);
    const styleName = stylePill.textContent;
    const base = windows * rate;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const cost = windows * parseFloat(c.dataset.price);
      extrasTotal += cost;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label} × ${windows}</span><span>+£${cost.toFixed(0)}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rStyle').textContent = `${windows} × ${styleName}`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

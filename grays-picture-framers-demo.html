<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grays Picture Framers — Instant Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFECE6;
    --card: #FFFFFF;
    --ink: #2C2A24;
    --ink-soft: #6B675C;
    --plum: #4E3B4F;
    --gold: #B98B45;
    --line: #E0DACC;
    --radius: 12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; padding:40px 20px; }
  .wrap{ max-width:980px; margin:0 auto; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Cormorant', serif; font-weight:700; font-size:30px; color:var(--plum); }
  .brand span{ color:var(--gold); }
  .tag{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; }
  .grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap:26px; }
  @media (max-width:780px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:28px; }
  h2{ font-family:'Cormorant', serif; font-weight:700; font-size:21px; margin:0 0 20px 0; color:var(--plum); }
  .field{ margin-bottom:22px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .field label .val{ font-family:'Space Mono', monospace; color:var(--gold); font-weight:700; }
  input[type=range]{ width:100%; accent-color: var(--plum); }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .pill.active{ background:var(--plum); color:white; border-color:var(--plum); }
  .checks{ display:flex; flex-direction:column; gap:10px; }
  .check{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .check input{ accent-color: var(--gold); width:16px; height:16px; }
  .check .price{ margin-left:auto; font-family:'Space Mono', monospace; color:var(--ink-soft); font-size:13px; }
  .ticket{ background:var(--plum); color:white; border-radius:var(--radius); padding:26px; }
  .ticket h2{ color:white; }
  .t-line{ display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:13px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.22); }
  .t-line.muted{ opacity:0.75; }
  .t-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; }
  .t-total .amount{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:#F0CE95; }
  .cta{ display:block; width:100%; margin-top:18px; padding:14px; border:none; border-radius:8px; background:var(--gold); color:white; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Grays <span>Framers</span></div>
    <div class="tag">Instant Quote · Carlisle</div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Your piece</h2>
      <div class="field">
        <label>Size (longest edge) <span class="val" id="sizeVal">30 cm</span></label>
        <input type="range" id="size" min="10" max="150" step="5" value="30">
      </div>
      <div class="field">
        <label>Frame style</label>
        <div class="pillrow" id="frameRow">
          <div class="pill active" data-rate="1.2">Simple moulding</div>
          <div class="pill" data-rate="1.8">Mid-range moulding</div>
          <div class="pill" data-rate="2.6">Premium / gilt</div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Add-ons</label>
        <div class="checks">
          <label class="check"><input type="checkbox" class="extra" data-price="18" data-label="Mount board"> Mount board <span class="price">+£18</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="25" data-label="Museum / UV glass"> Museum / UV glass <span class="price">+£25</span></label>
          <label class="check"><input type="checkbox" class="extra" data-price="15" data-label="Multi-aperture mount"> Multi-aperture mount <span class="price">+£15</span></label>
        </div>
      </div>
    </div>
    <div class="ticket">
      <h2>Estimate</h2>
      <div class="t-line"><span id="rSize">30 cm · Simple moulding</span><span id="rBase">£—</span></div>
      <div id="rExtras"></div>
      <div class="t-total"><span>Total</span><span class="amount" id="rTotal">£0</span></div>
      <button class="cta">Enquire with David</button>
      <div class="note">Estimate only — confirmed when David sees the piece</div>
    </div>
  </div>
</div>
<script>
  document.getElementById('size').addEventListener('input', calc);
  document.querySelectorAll('#frameRow .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#frameRow .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      calc();
    });
  });
  document.querySelectorAll('.extra').forEach(c=> c.addEventListener('change', calc));
  function calc(){
    const size = parseInt(document.getElementById('size').value);
    document.getElementById('sizeVal').textContent = size + ' cm';
    const framePill = document.querySelector('#frameRow .pill.active');
    const rate = parseFloat(framePill.dataset.rate);
    const frameName = framePill.textContent;
    const base = size * rate;
    let extrasTotal = 0;
    let extrasHtml = '';
    document.querySelectorAll('.extra:checked').forEach(c=>{
      const price = parseFloat(c.dataset.price);
      extrasTotal += price;
      extrasHtml += `<div class="t-line muted"><span>${c.dataset.label}</span><span>+£${price}</span></div>`;
    });
    const total = base + extrasTotal;
    document.getElementById('rSize').textContent = `${size} cm · ${frameName}`;
    document.getElementById('rBase').textContent = `£${base.toFixed(0)}`;
    document.getElementById('rExtras').innerHTML = extrasHtml;
    document.getElementById('rTotal').textContent = `£${total.toFixed(0)}`;
  }
  calc();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cumbria Rubbish Removals | Instant Estimate</title><style>:root{--i:#202c35;--a:#3e9a65;--p:#f1f4f0;--l:#d7dfd5}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Arial;padding:32px 17px}.w{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:23px;gap:10px}.brand{font-size:26px;font-weight:900}.brand b{color:var(--a)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.card,.quote{padding:26px;border-radius:16px}.card{background:#fff;border:1px solid var(--l)}.quote{background:var(--i);color:white;height:max-content}h1,h2{font-size:21px;margin:0 0 20px}.field{margin-bottom:22px}.label{display:block;font-weight:bold;margin-bottom:9px}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:#f4f7f3;border:1px solid var(--l);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--i)}.opt.on{background:var(--a);border-color:var(--a);color:white}.check{display:flex;align-items:center;gap:9px;margin:11px 0}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #6f8077;padding:10px 0;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px;font-weight:bold}.total strong{font:700 33px monospace;color:#86dba4}.book{width:100%;border:0;border-radius:8px;background:#70c88e;padding:13px;color:#163626;font-weight:bold;margin-top:18px}.note{font-size:11px;text-align:center;color:#c9d6cc;margin:11px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand">Cumbria <b>Rubbish Removals</b></div><div class="tag">Instant estimate</div></header><div class="grid"><section class="card"><h1>Tell us what’s going</h1><div class="field"><span class="label">Amount of waste</span><div class="opts" id="amount"><button class="opt on" data-p="55">A few items</button><button class="opt" data-p="95">Quarter load</button><button class="opt" data-p="160">Half load</button><button class="opt" data-p="280">Full load</button></div></div><div class="field"><span class="label">Collection type</span><div class="opts" id="type"><button class="opt on" data-p="0">General household</button><button class="opt" data-p="25">Garden waste</button><button class="opt" data-p="45">House clearance</button></div></div><div class="field"><span class="label">Possible extras</span><label class="check"><input class="x" data-p="20" data-n="Heavy items" type="checkbox">Heavy items <span>+£20</span></label><label class="check"><input class="x" data-p="25" data-n="Appliance disposal" type="checkbox">Appliance disposal <span>+£25</span></label><label class="check"><input class="x" data-p="30" data-n="Upstairs collection" type="checkbox">Upstairs collection <span>+£30</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">A few items</span><span id="base">£55</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£55</strong></div><button class="book">Request collection</button><p class="note">Demo estimate only — final price depends on the waste type and amount.</p></aside></div></main><script>let a=55,b=0,n='A few items';function set(id,fn){document.querySelectorAll('#'+id+' .opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.remove('on'));e.classList.add('on');fn(e);go()})}set('amount',e=>{a=+e.dataset.p;n=e.textContent});set('type',e=>b=+e.dataset.p);document.querySelectorAll('.x').forEach(e=>e.onchange=go);function go(){let t=a+b,h='';document.querySelectorAll('.x:checked').forEach(e=>{t+=+e.dataset.p;h+='<div class=row><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+'</span></div>'});label.textContent=n;base.textContent='£'+(a+b);xs.innerHTML=h;total.textContent='£'+t}go()</script></body></html>

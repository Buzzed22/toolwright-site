<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CowinGroup — Instant Estimate</title><style>body{margin:0;padding:30px 16px;background:#f6f3ed;font:15px Arial;color:#343129}.w{max-width:880px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:20px}.brand{font-size:27px;font-weight:bold}.brand b{color:#b17d37}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card,.quote{padding:25px;border-radius:14px}.card{background:#fff;border:1px solid #e6ddcf}.quote{background:#343129;color:#fff;height:max-content}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{padding:10px;border:1px solid #e6ddcf;border-radius:8px;background:#fbf8f2;cursor:pointer}.on{background:#b17d37;color:#fff;border-color:#b17d37}.field{margin:0 0 21px}.field b{display:block;margin-bottom:8px}.check{display:flex;margin:10px 0;gap:8px}.check span{margin-left:auto;font:12px monospace;color:#687}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #8e8273;font:13px monospace}.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:17px}.total strong{font:700 32px monospace;color:#f2ca86}.button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#e7bf7b;font-weight:bold}.note{text-align:center;font-size:11px;color:#ddd2c3}@media(max-width:700px){.grid{grid-template-columns:1fr}.quote{order:-1}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>Cowin</b>Group</div><small>INSTANT ESTIMATE</small></header><div class="grid"><section class="card"><h2>Build your clean</h2><div class="field"><b>Service</b><div class="opts" id="a"><button class="opt on" data-p="55">Regular clean</button><button class="opt" data-p="95">Deep clean</button><button class="opt" data-p="125">End of tenancy</button><button class="opt" data-p="100">Commercial clean</button></div></div><div class="field"><b>Property size</b><div class="opts" id="b"><button class="opt on" data-p="0">Up to 2 bedrooms</button><button class="opt" data-p="25">3 bedrooms</button><button class="opt" data-p="45">4+ bedrooms</button></div></div><div class="field"><b>Extras</b><label class="check"><input class="x" data-p="15" data-n="Inside fridge" type="checkbox">Inside fridge <span>+£15</span></label><label class="check"><input class="x" data-p="20" data-n="Inside oven" type="checkbox">Inside oven <span>+£20</span></label></div></section><aside class="quote"><h2>Your estimate</h2><div class="row"><span id="label">Regular clean</span><span id="base">£55</span></div><div id="xs"></div><div class="total"><span>Total from</span><strong id="total">£55</strong></div><button class="button">Request a quote</button><p class="note">Demo estimate only — CowinGroup confirms the final price.</p></aside></div></main><script>let p=55,q=0,n="Regular clean";function s(id,f){document.querySelectorAll("#"+id+" .opt").forEach(e=>e.onclick=()=>{document.querySelectorAll("#"+id+" .opt").forEach(x=>x.classList.remove("on"));e.classList.add("on");f(e);go()})}s("a",e=>{p=+e.dataset.p;n=e.textContent});s("b",e=>q=+e.dataset.p);document.querySelectorAll(".x").forEach(e=>e.onchange=go);function go(){let t=p+q,h="";document.querySelectorAll(".x:checked").forEach(e=>{t+=+e.dataset.p;h+='<div class="row"><span>'+e.dataset.n+'</span><span>+£'+e.dataset.p+"</span></div>"});label.textContent=n;base.textContent="£"+(p+q);xs.innerHTML=h;total.textContent="£"+t}go()</script></body></html>
